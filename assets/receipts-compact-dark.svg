<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 455" width="470" height="455" role="img" aria-labelledby="t d">
<title id="t">Ruturaj Sonkamble — receipts</title>
<desc id="d">Ruturaj Sonkamble · AI engineer · Pune / I build agents that act on real systems, / then measure if they got it right. / argus    0 LLM calls over 10 runs /          5/5 hidden bugs caught / racelab  0/50 bad commits vs 45–48/50 /          for blind retry / verdict  rank agreement τ 0.669 → 0.877 / anomaly  38× faster than real time /          on a 6 GB laptop GPU</desc>
<style>.card{fill:#161b22;stroke:#30363d;stroke-width:1.5}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:17px;fill:#e6edf3;white-space:pre}.title{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#8b949e}.text{fill:#e6edf3}.muted{fill:#8b949e}.prompt{fill:#7ee787;font-weight:600}.name{fill:#79c0ff}.hi{fill:#ffa657;font-weight:600}.curtain{fill:#161b22}.fade{animation:fade .45s ease-out backwards}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.blink{animation:blink 1.05s steps(1) infinite}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.fade,.curtain,.blink{animation:none!important}}@keyframes t0{from{transform:translateX(-78.4px)}to{transform:translateX(0)}}.c0{animation:t0 0.45s steps(8) 0.35s backwards}@keyframes t5{from{transform:translateX(-186.2px)}to{transform:translateX(0)}}.c5{animation:t5 1.04s steps(19) 1.95s backwards}</style>
<rect class="card" x="1" y="1" width="468" height="453" rx="12"/>
<circle cx="26" cy="22" r="6" fill="#ff7b72"/><circle cx="46" cy="22" r="6" fill="#d29922"/><circle cx="66" cy="22" r="6" fill="#3fb950"/>
<line x1="1" y1="44" x2="469" y2="44" stroke="#30363d" stroke-width="1"/>
<text class="title" x="235.0" y="27" text-anchor="middle">ruturaj@pune: ~/receipts</text>
<text class="mono" x="24" y="78" textLength="78.4" lengthAdjust="spacing"><tspan class="prompt">$ </tspan><tspan class="text">whoami</tspan></text>
<rect class="curtain c0" x="102.4" y="61" width="84.4" height="27"/>
<g class="fade" style="animation-delay:1.05s"><text class="mono" x="24" y="105" textLength="372.4" lengthAdjust="spacing"><tspan class="text">Ruturaj Sonkamble</tspan><tspan class="muted"> · </tspan><tspan class="text">AI engineer</tspan><tspan class="muted"> · </tspan><tspan class="text">Pune</tspan></text></g>
<g class="fade" style="animation-delay:1.30s"><text class="mono" x="24" y="132" textLength="392.0" lengthAdjust="spacing"><tspan class="muted">I build agents that act on real systems,</tspan></text></g>
<g class="fade" style="animation-delay:1.40s"><text class="mono" x="24" y="159" textLength="333.2" lengthAdjust="spacing"><tspan class="muted">then measure if they got it right.</tspan></text></g>
<text class="mono" x="24" y="213" textLength="186.2" lengthAdjust="spacing"><tspan class="prompt">$ </tspan><tspan class="text">tail receipts.log</tspan></text>
<rect class="curtain c5" x="210.2" y="196" width="192.2" height="27"/>
<g class="fade" style="animation-delay:3.00s"><text class="mono" x="24" y="240" textLength="323.4" lengthAdjust="spacing"><tspan class="name">argus    </tspan><tspan class="hi">0 LLM calls</tspan><tspan class="text"> over 10 runs</tspan></text></g>
<g class="fade" style="animation-delay:3.10s"><text class="mono" x="24" y="267" textLength="303.8" lengthAdjust="spacing"><tspan class="text">         </tspan><tspan class="hi">5/5</tspan><tspan class="text"> hidden bugs caught</tspan></text></g>
<g class="fade" style="animation-delay:3.35s"><text class="mono" x="24" y="294" textLength="362.6" lengthAdjust="spacing"><tspan class="name">racelab  </tspan><tspan class="hi">0/50</tspan><tspan class="text"> bad commits vs </tspan><tspan class="hi">45–48/50</tspan></text></g>
<g class="fade" style="animation-delay:3.45s"><text class="mono" x="24" y="321" textLength="235.2" lengthAdjust="spacing"><tspan class="text">         for blind retry</tspan></text></g>
<g class="fade" style="animation-delay:3.70s"><text class="mono" x="24" y="348" textLength="382.2" lengthAdjust="spacing"><tspan class="name">verdict  </tspan><tspan class="text">rank agreement </tspan><tspan class="hi">τ 0.669 → 0.877</tspan></text></g>
<g class="fade" style="animation-delay:3.95s"><text class="mono" x="24" y="375" textLength="333.2" lengthAdjust="spacing"><tspan class="name">anomaly  </tspan><tspan class="hi">38×</tspan><tspan class="text"> faster than real time</tspan></text></g>
<g class="fade" style="animation-delay:4.05s"><text class="mono" x="24" y="402" textLength="284.2" lengthAdjust="spacing"><tspan class="text">         on a 6 GB laptop GPU</tspan></text></g>
<g class="fade" style="animation-delay:4.55s"><text class="mono" x="24" y="429" textLength="19.6" lengthAdjust="spacing"><tspan class="prompt">$ </tspan></text><rect class="blink" x="45.6" y="414" width="9" height="19" rx="1" fill="#7ee787" style="animation-delay:5.05s"/></g>
